name: Offline Pyodide sealed-worker parity
on:
  workflow_dispatch:
  push:
    paths:
      - "web/toolchain/offline-runtime-spike/**"
      - "web/toolchain/asset-generation-spike/**"
      - "dm/ios/tools/**"
      - ".github/workflows/offline-pyodide-checks.yml"
  pull_request:
    paths:
      - "web/toolchain/offline-runtime-spike/**"
      - "web/toolchain/asset-generation-spike/**"
      - "dm/ios/tools/**"
      - ".github/workflows/offline-pyodide-checks.yml"
permissions:
  contents: read
concurrency:
  group: offline-pyodide-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sealed-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install pinned official runtime and browser tools
        working-directory: web/toolchain/asset-generation-spike
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          python3 -m venv "$RUNNER_TEMP/offline-reference"
          "$RUNNER_TEMP/offline-reference/bin/pip" install 'Pillow==11.1.0'
      - name: Package original core and independently generated native references
        working-directory: web/toolchain/asset-generation-spike
        run: |
          npm run prepare:runtime
          npm run prepare:core
          "$RUNNER_TEMP/offline-reference/bin/python" test/native-reference.py
      - name: Apply source-locked internal loader adaptation and hash public closure
        run: node web/toolchain/offline-runtime-spike/pyodide-prepare.mjs
      - name: Demand native byte parity with no post-seal HTTP receipts
        run: |
          PLAYWRIGHT_ENTRY="$GITHUB_WORKSPACE/web/toolchain/asset-generation-spike/node_modules/playwright/index.mjs" \
            timeout --kill-after=5s 180s node web/toolchain/offline-runtime-spike/pyodide-browser.mjs
