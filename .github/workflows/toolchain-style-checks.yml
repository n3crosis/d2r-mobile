name: Authored toolchain style checks

on:
  workflow_dispatch:
  push:
    branches: [feature/web-ipa-packager]
    paths:
      - "web/toolchain/nsp-extract-spike/**"
      - "web/toolchain/synthetic-signed-nca/inject-test-root.py"
      - "web/toolchain/synthetic-signed-nca/verify-build-isolation.py"
      - "web/toolchain/synthetic-signed-nca/run-ci.sh"
      - "web/toolchain/spirv-cross-spike/**"
      - "web/toolchain/asset-generation-spike/**"
      - "web/toolchain/asset-generation-spike/test/native-v61.py"
      - "web/toolchain/program-rewrite-spike/**"
      - "web/toolchain/texture-spike/**"
      - "web/toolchain/shell-release-evidence/compare-source.py"
      - "web/toolchain/shell-release-evidence/test-source-comparison.py"
      - "web/toolchain/style/**"
      - "web/scripts/check-authored-style.sh"
      - ".github/workflows/toolchain-style-checks.yml"
  pull_request:
    paths:
      - "web/toolchain/nsp-extract-spike/**"
      - "web/toolchain/synthetic-signed-nca/inject-test-root.py"
      - "web/toolchain/synthetic-signed-nca/verify-build-isolation.py"
      - "web/toolchain/synthetic-signed-nca/run-ci.sh"
      - "web/toolchain/spirv-cross-spike/**"
      - "web/toolchain/asset-generation-spike/**"
      - "web/toolchain/asset-generation-spike/test/native-v61.py"
      - "web/toolchain/program-rewrite-spike/**"
      - "web/toolchain/texture-spike/**"
      - "web/toolchain/shell-release-evidence/compare-source.py"
      - "web/toolchain/shell-release-evidence/test-source-comparison.py"
      - "web/toolchain/style/**"
      - "web/scripts/check-authored-style.sh"
      - ".github/workflows/toolchain-style-checks.yml"

permissions:
  contents: read

concurrency:
  group: toolchain-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authored-source-style:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install exact formatter versions from the official Python registry
        run: |
          python3 -m venv "$RUNNER_TEMP/style-tools"
          "$RUNNER_TEMP/style-tools/bin/pip" install --index-url https://pypi.org/simple --only-binary=:all: ruff==0.14.0 clang-format==21.1.2
          echo "$RUNNER_TEMP/style-tools/bin" >> "$GITHUB_PATH"
      - name: Run the same authored-language checks as local development
        run: bash web/scripts/check-authored-style.sh
