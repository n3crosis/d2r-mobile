name: Synthetic browser SPIRV-Cross parity

on:
  push:
    branches: [feature/web-ipa-packager]
    paths:
      - "web/toolchain/spirv-cross-spike/**"
      - "dm/gfx/tools/dmsh_build.py"
      - "dm/gfx/tools/dmsh_chain.py"
      - "dm/gfx/tools/nometal_run.py"
      - ".github/workflows/spirv-cross-browser-checks.yml"
  pull_request:
    paths:
      - "web/toolchain/spirv-cross-spike/**"
      - "dm/gfx/tools/dmsh_build.py"
      - "dm/gfx/tools/dmsh_chain.py"
      - "dm/gfx/tools/nometal_run.py"
      - ".github/workflows/spirv-cross-browser-checks.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: spirv-cross-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-wasm-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: web/toolchain/spirv-cross-spike
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Verify pure byte boundary and native replay reflection
        run: node --test test.mjs
      - name: Fetch exact official upstream sources and SDK
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 https://github.com/KhronosGroup/SPIRV-Cross.git "$RUNNER_TEMP/spirv-cross"
          test "$(git -C "$RUNNER_TEMP/spirv-cross" rev-parse HEAD)" = 6c09849fe88c48eaed08413aa022aaa136a3a057
          git clone --depth 1 --branch 4.0.20 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/spirv-emsdk"
          test "$(git -C "$RUNNER_TEMP/spirv-emsdk" rev-parse HEAD)" = e4fe26ef59168ff44f4c23c466e497bf60b3411e
          "$RUNNER_TEMP/spirv-emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/spirv-emsdk/emsdk" activate 4.0.20
      - name: Build original CLI natively and as browser WASM
        run: |
          bash build.sh native "$RUNNER_TEMP/spirv-cross" "$RUNNER_TEMP/spirv-native"
          source "$RUNNER_TEMP/spirv-emsdk/emsdk_env.sh"
          bash build.sh wasm "$RUNNER_TEMP/spirv-cross" "$RUNNER_TEMP/spirv-wasm"
      - name: Install CI-only synthetic assembly and browser tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y spirv-tools
          spirv-as --version
          npm ci --ignore-scripts --prefix ../shader-spike
          (cd ../shader-spike && npx --no-install playwright install --with-deps chromium)
      - name: Assemble authored fixtures and run original native oracle
        run: |
          mkdir -p results
          python3 provenance.py > results/native-chain-observed.json
          for fixture in fixture fragment storage; do
            spirv-as --target-env spv1.0 "$fixture.spvasm" -o "wwwroot/$fixture.spv"
            spirv-val --target-env spv1.0 "wwwroot/$fixture.spv"
            "$RUNNER_TEMP/spirv-native/spirv-cross" --msl --msl-version 20300 --msl-argument-buffers --msl-texture-buffer-native --msl-pad-fragment-output "wwwroot/$fixture.spv" --output "results/$fixture.native.metal"
            "$RUNNER_TEMP/spirv-native/spirv-cross" --reflect json "wwwroot/$fixture.spv" --output "results/$fixture.native.json"
          done
          sha256sum toolchain-lock.json build.sh *.spvasm wwwroot/*.mjs wwwroot/*.wasm wwwroot/*.spv "$GITHUB_WORKSPACE/dm/gfx/tools/dmsh_build.py" "$GITHUB_WORKSPACE/dm/gfx/tools/dmsh_chain.py" "$GITHUB_WORKSPACE/dm/gfx/tools/nometal_run.py" > results/source-chain.sha256
      - name: Compare actual browser worker to native source and reflection
        run: node capture-browser.mjs results
      - name: Retain synthetic diagnostics and deployable WASM bundle
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: synthetic-spirv-cross-browser-parity
          path: |
            web/toolchain/spirv-cross-spike/results/
            web/toolchain/spirv-cross-spike/wwwroot/
            web/toolchain/spirv-cross-spike/toolchain-lock.json
          if-no-files-found: warn
          retention-days: 7
