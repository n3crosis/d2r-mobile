name: NSP extraction WASM boundary
# Expensive proof: run locally first, or dispatch only the relevant subsystem.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nsp-extraction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install pinned official Emscripten SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 4.0.20 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/nsp-emsdk"
          test "$(git -C "$RUNNER_TEMP/nsp-emsdk" rev-parse HEAD)" = e4fe26ef59168ff44f4c23c466e497bf60b3411e
          "$RUNNER_TEMP/nsp-emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/nsp-emsdk/emsdk" activate 4.0.20
      - name: Build pinned upstream and bounded WASM API
        shell: bash
        run: |
          source "$RUNNER_TEMP/nsp-emsdk/emsdk_env.sh"
          bash web/toolchain/nsp-extract-spike/build-wasm.sh
      - name: Run synthetic container tests
        run: node --test web/toolchain/nsp-extract-spike/*.test.mjs web/tests/extraction-worker-client.test.mjs web/tests/extraction-job-adapter.test.mjs web/tests/d2r-expansion-policy.test.mjs
      - name: Install browser test tools from official npm package
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/nsp-playwright" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/nsp-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise WASM in Chromium dedicated Worker
        shell: bash
        run: |
          PLAYWRIGHT_ENTRY="$RUNNER_TEMP/nsp-playwright/node_modules/playwright/index.mjs" \
            node web/toolchain/nsp-extract-spike/browser-smoke.mjs
      - name: Retain public WASM and required notices only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nsp-metadata-wasm-boundary
          path: web/toolchain/nsp-extract-spike/dist/
          if-no-files-found: error
          retention-days: 7
