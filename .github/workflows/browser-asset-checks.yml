name: Synthetic browser asset generation
on:
  push:
    branches: [feature/web-ipa-packager]
    paths:
      [
        "web/toolchain/asset-generation-spike/**",
        "web/toolchain/texture-spike/**",
        "web/asset-generator-adapter.mjs",
        "web/v61-asset-worker.mjs",
        "web/native-art-generator.mjs",
        "web/native-art-texture.mjs",
        "dm/gfx/nvn/nvn_tex.*",
        "dm/gfx/tex/nvn_*",
        "dm/ios/tools/**",
        ".github/workflows/browser-asset-checks.yml",
      ]
  pull_request:
    paths:
      [
        "web/toolchain/asset-generation-spike/**",
        "web/toolchain/texture-spike/**",
        "web/asset-generator-adapter.mjs",
        "web/v61-asset-worker.mjs",
        "web/native-art-generator.mjs",
        "web/native-art-texture.mjs",
        "dm/gfx/nvn/nvn_tex.*",
        "dm/gfx/tex/nvn_*",
        "dm/ios/tools/**",
        ".github/workflows/browser-asset-checks.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web/toolchain/asset-generation-spike
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install pinned build-only dependencies
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          python3 -m venv "$RUNNER_TEMP/asset-reference"
          "$RUNNER_TEMP/asset-reference/bin/pip" install 'Pillow==11.1.0'
      - name: Package audited native core and self-hosted runtime
        run: |
          npm run prepare:core
          npm run prepare:runtime
      - name: Independent synthetic native reference
        run: |
          "$RUNNER_TEMP/asset-reference/bin/python" test/native-reference.py
          python3 test/native-derived.py
          "$RUNNER_TEMP/asset-reference/bin/python" test/native-art-reference.py
      - name: Execute real Chromium worker and demand exact parity
        run: |
          timeout --kill-after=5s 180s npm run test:browser
          "$RUNNER_TEMP/asset-reference/bin/python" test/verify-png.py
      - name: Build pinned texture bridge for cross-adapter parity
        run: |
          git clone --depth 1 --branch 4.0.20 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/asset-texture-emsdk"
          test "$(git -C "$RUNNER_TEMP/asset-texture-emsdk" rev-parse HEAD)" = e4fe26ef59168ff44f4c23c466e497bf60b3411e
          "$RUNNER_TEMP/asset-texture-emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/asset-texture-emsdk/emsdk" activate 4.0.20
          source "$RUNNER_TEMP/asset-texture-emsdk/emsdk_env.sh"
          bash ../texture-spike/build-wasm.sh
          python3 test/native-v61.py
      - name: Verify actual v61 texture worker through asset and packaging adapters
        run: |
          timeout --kill-after=5s 180s node test/v61-browser.mjs
          "$RUNNER_TEMP/asset-reference/bin/python" test/native-v61.py --verify
      - name: Retain parity evidence and self-hostable synthetic spike
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: browser-asset-generation-evidence
          path: |
            web/toolchain/asset-generation-spike/test-results/
            web/toolchain/asset-generation-spike/public/
            web/toolchain/asset-generation-spike/source-provenance.json
            web/asset-generator-adapter.mjs
            web/v61-asset-worker.mjs
            web/native-art-generator.mjs
            web/native-art-texture.mjs
            web/toolchain/texture-spike/texture-worker.mjs
            web/toolchain/texture-spike/browser-texture.mjs
            web/toolchain/texture-spike/dist/
          if-no-files-found: error
