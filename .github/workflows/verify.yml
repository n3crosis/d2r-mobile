name: Verify
on:
  push:
    branches: [feature/web-ipa-packager]
    paths:
      [
        "web/**",
        "dm/gfx/tools/**",
        "dm/third_party/ryujinx/**",
        "dm/tools/**",
        ".github/workflows/verify.yml",
      ]
  pull_request:
    paths:
      [
        "web/**",
        "dm/gfx/tools/**",
        "dm/third_party/ryujinx/**",
        "dm/tools/**",
        ".github/workflows/verify.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Shared local and CI quick verification
        run: node web/verification/verify.mjs quick
      - name: Upload built static webpage (no source, game files, or keys)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: web-preview
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
