name: Verify
on:
  push:
    branches: [feature/web-ipa-packager]
    paths:
      [
        "web/**",
        "dm/gfx/tools/**",
        "dm/third_party/ryujinx/**",
        "dm/third_party/bcdec/**",
        "dm/host/dm_kills.c",
        "dm/i18n/ui_text.tsv",
        "dm/ios/NativeHUD/touch/close.png",
        "dm/ios/Sources/TouchArt/native_art_manifest.json",
        "dm/ios/docs/native_art_v1_geometry.json",
        "dm/ios/docs/touch_layout_spec_native_binding_v5.json",
        "LICENSE",
        "dm/tools/**",
        "dm/ios/tools/**",
        "dm/gfx/nvn/**",
        "dm/gfx/tex/**",
        ".github/workflows/verify.yml",
        "!**/*.md",
        "!**/*.MD",
      ]
  pull_request:
    paths:
      [
        "web/**",
        "dm/gfx/tools/**",
        "dm/third_party/ryujinx/**",
        "dm/third_party/bcdec/**",
        "dm/host/dm_kills.c",
        "dm/i18n/ui_text.tsv",
        "dm/ios/NativeHUD/touch/close.png",
        "dm/ios/Sources/TouchArt/native_art_manifest.json",
        "dm/ios/docs/native_art_v1_geometry.json",
        "dm/ios/docs/touch_layout_spec_native_binding_v5.json",
        "LICENSE",
        "dm/tools/**",
        "dm/ios/tools/**",
        "dm/gfx/nvn/**",
        "dm/gfx/tex/**",
        ".github/workflows/verify.yml",
        "!**/*.md",
        "!**/*.MD",
      ]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Build frontend and enforce requested code-quality gates
        run: node web/verification/verify.mjs quick
      - name: Authenticate pinned AIR release identity
        id: air_source
        run: node web/runtime-build/build-air-compiler.mjs --fingerprint
      - name: Cache only release-bound public AIR compiler outputs
        id: air_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/toolchain/metal-air-compiler/dist
            web/runtime-build/.build/air-compiler-receipt.sha256
          key: public-air-release-v1-${{ steps.air_source.outputs.release_manifest_sha256 }}
      - name: Cache pinned public compiler source archive separately
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/runtime-build/.build/air-compiler-release
          key: public-air-release-assets-v1-${{ steps.air_source.outputs.release_manifest_sha256 }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.402"
      - name: Prepare pinned SDK for non-AIR browser runtimes
        run: |
          git clone --depth 1 --branch 4.0.20 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/browser-emsdk"
          test "$(git -C "$RUNNER_TEMP/browser-emsdk" rev-parse HEAD)" = e4fe26ef59168ff44f4c23c466e497bf60b3411e
      - name: Cache only public Emscripten SDK downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/browser-emsdk/downloads
          key: public-emsdk-downloads-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-4.0.20-e4fe26ef59168ff44f4c23c466e497bf60b3411e
      - name: Build pinned public browser runtimes
        id: runtime
        env:
          EMSDK_KEEP_DOWNLOADS: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
          DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: "true"
          D2R_AIR_COMPILER_SOURCE_FINGERPRINT: ${{ steps.air_source.outputs.source_fingerprint }}
          D2R_AIR_COMPILER_RELEASE_MANIFEST_SHA256: ${{ steps.air_source.outputs.release_manifest_sha256 }}
        run: |
          df -h .
          "$RUNNER_TEMP/browser-emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/browser-emsdk/emsdk" activate 4.0.20
          source "$RUNNER_TEMP/browser-emsdk/emsdk_env.sh"
          emcc --version | grep -E '^emcc .* 4[.]0[.]20([[:space:]]|$)'
          node web/runtime-build/build-air-compiler.mjs
          # Written only after source/receipt authentication and the compile canary pass.
          printf 'air_compiler_verified=true\n' >> "$GITHUB_OUTPUT"
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown --component rustfmt --component clippy
          printf '{"sdk":{"version":"10.0.402","rollForward":"disable","allowPrerelease":false,"workloadVersion":"10.0.402"}}\n' > web/toolchain/shader-spike/global.json
          (cd web/toolchain/shader-spike && dotnet workload install wasm-tools)
          node web/runtime-build/build.mjs
          df -h .
      - name: Authenticate compiler evidence after runtime failure
        id: air_failure_verify
        if: ${{ failure() && steps.runtime.outcome == 'failure' }}
        run: node web/runtime-build/air-compiler-assets.mjs verify --source-fingerprint "${{ steps.air_source.outputs.source_fingerprint }}"
      - name: Preserve authenticated compiler cache despite later failure
        if: ${{ !cancelled() && steps.air_failure_verify.outcome == 'success' && steps.air_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/toolchain/metal-air-compiler/dist
            web/runtime-build/.build/air-compiler-receipt.sha256
          key: public-air-release-v1-${{ steps.air_source.outputs.release_manifest_sha256 }}
      - name: Prepare matching diagnostic compiler source after runtime failure
        id: air_failure_source
        if: ${{ !cancelled() && steps.air_failure_verify.outcome == 'success' }}
        run: node web/runtime-build/prepare-air-compiler-source.mjs --output "$RUNNER_TEMP/air-compiler-diagnostic-source"
      - name: Upload complete corresponding diagnostic compiler source
        id: air_failure_source_upload
        if: ${{ !cancelled() && steps.air_failure_source.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: air-compiler-diagnostic-source
          path: ${{ runner.temp }}/air-compiler-diagnostic-source/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Assemble explicitly unvalidated public compiler diagnostic
        id: air_failure_bundle
        if: ${{ !cancelled() && steps.air_failure_source_upload.outcome == 'success' }}
        env:
          D2R_AIR_COMPILER_SOURCE_FINGERPRINT: ${{ steps.air_source.outputs.source_fingerprint }}
          D2R_AIR_COMPILER_RELEASE_MANIFEST_SHA256: ${{ steps.air_source.outputs.release_manifest_sha256 }}
          D2R_AIR_COMPILER_SOURCE_REPORT_SHA256: ${{ steps.air_failure_source.outputs.source_report_sha256 }}
          D2R_AIR_COMPILER_SOURCE_ARTIFACT_ID: ${{ steps.air_failure_source_upload.outputs.artifact-id }}
        run: node web/runtime-build/prepare-air-compiler-diagnostic.mjs "$RUNNER_TEMP/air-compiler-diagnostic" "$RUNNER_TEMP/air-compiler-diagnostic-source/source-report.json"
      - name: Upload unvalidated compiler diagnostic, never a successful preview
        if: ${{ !cancelled() && steps.air_failure_bundle.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: air-compiler-diagnostic-unvalidated
          path: ${{ runner.temp }}/air-compiler-diagnostic/
          if-no-files-found: error
          retention-days: 7
      - name: Stage only manifest-verified public runtime files
        run: node web/runtime-build/stage-preview.mjs
        env:
          EXPECTED_RUNTIME_MANIFEST_SHA256: ${{ steps.runtime.outputs.manifest_sha256 }}
      - name: Prepare complete matching compiler source (no LLVM compilation)
        run: node web/runtime-build/prepare-air-compiler-source.mjs --output "$RUNNER_TEMP/air-compiler-source-artifact"
      - name: Upload complete corresponding compiler source separately
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: air-compiler-source
          path: ${{ runner.temp }}/air-compiler-source-artifact/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser webpage and public runtimes (no game files or keys)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: web-preview
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Capture actual browser preview with runner Chrome (no game inputs)
        id: preview_screenshot
        continue-on-error: true
        timeout-minutes: 2
        run: |
          screenshot_dir="$RUNNER_TEMP/web-preview-screenshot"
          mkdir -p "$screenshot_dir"
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          (cd web && exec bun scripts/serve.mjs) > "$screenshot_dir/server.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          timeout 90 "$chrome" --headless --disable-gpu --no-first-run --no-default-browser-check \
            --user-data-dir="$screenshot_dir/chrome-profile" \
            --window-size=1440,1200 --force-device-scale-factor=1 --hide-scrollbars \
            --timeout=60000 --virtual-time-budget=20000 \
            --screenshot="$screenshot_dir/web-preview.png" --dump-dom http://127.0.0.1:4173/ \
            > "$screenshot_dir/page.html"
          test -s "$screenshot_dir/web-preview.png"
          grep -q 'role="heading" aria-level="1"' "$screenshot_dir/page.html"
          printf 'Captured the actual built UI in runner Chrome at 1440 x 1200. No game inputs were selected or processed. This image is not an IPA or device validation.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser preview screenshot separately
        id: preview_screenshot_upload
        if: ${{ !cancelled() && steps.preview_screenshot.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: web-preview-screenshot
          path: ${{ runner.temp }}/web-preview-screenshot/web-preview.png
          if-no-files-found: error
          retention-days: 7
      - name: Report unavailable screenshot without discarding validated preview
        if: ${{ !cancelled() && (steps.preview_screenshot.outcome == 'failure' || steps.preview_screenshot_upload.outcome == 'failure') }}
        run: |
          echo "::warning::Browser screenshot capture or upload failed; the separately uploaded web-preview remains valid."
          printf 'Browser screenshot capture or upload failed. See the screenshot step logs; the separately uploaded web-preview artifact is unaffected.\n' >> "$GITHUB_STEP_SUMMARY"
