name: ZIP64 bounded large-output checks

on:
  workflow_dispatch:
  push:
    paths:
      - "web/zip64-writer.mjs"
      - "web/preflight.mjs"
      - "web/tests/zip64-writer.test.mjs"
      - "web/LARGE_OUTPUT_SCOPE.md"
      - ".github/workflows/zip64-large-output-checks.yml"
  pull_request:
    paths:
      - "web/zip64-writer.mjs"
      - "web/preflight.mjs"
      - "web/tests/zip64-writer.test.mjs"
      - "web/LARGE_OUTPUT_SCOPE.md"
      - ".github/workflows/zip64-large-output-checks.yml"

permissions:
  contents: read

concurrency:
  group: zip64-large-output-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Synthetic zero bytes only: a reused 4 MiB source buffer and discard/count sink.
# No game data, keys, deployments, caches or payload/archive artifact uploads.
# Pinned official action tags use Node 24 internally (verified 2026-10-20).
jobs:
  large-stream:
    name: Real 4 GiB stream with bounded buffers and independent CRC oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Confirm independent Python oracle prerequisite
        run: python3 --version
      - name: Stream real large payload without retaining output
        timeout-minutes: 5
        env:
          ZIP64_LARGE_STREAM_TEST: "1"
          NODE_OPTIONS: --max-old-space-size=256
        run: node --test --test-timeout=240000 tests/zip64-writer.test.mjs
      - name: Record validation boundary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### ZIP64 bounded stream validation'
            echo 'The test processes 4 GiB + 4 MiB of synthetic zero bytes through the real CRC loop, with one reused 4 MiB input buffer and a discard/count sink. Python zlib independently checks CRC; a second entry verifies a central-directory offset above 4 GiB.'
            echo 'Small real archives are independently extracted with Python zipfile. Metadata-only tests cover exact offsets above 2^53.'
            echo 'No multi-gigabyte archive is retained or independently extracted. Browser destination quotas, game data, resource-export integration, IPA installation and device compatibility are not established by this job.'
          } >> "$GITHUB_STEP_SUMMARY"
