name: NVN texture WASM boundary
# Expensive proof: run locally first, or dispatch only the relevant subsystem.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: texture-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install pinned official Emscripten SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 4.0.20 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/texture-emsdk"
          test "$(git -C "$RUNNER_TEMP/texture-emsdk" rev-parse HEAD)" = e4fe26ef59168ff44f4c23c466e497bf60b3411e
          "$RUNNER_TEMP/texture-emsdk/emsdk" install 4.0.20
          "$RUNNER_TEMP/texture-emsdk/emsdk" activate 4.0.20
      - name: Build bounded texture WASM API
        shell: bash
        run: |
          source "$RUNNER_TEMP/texture-emsdk/emsdk_env.sh"
          bash web/toolchain/texture-spike/build-wasm.sh
      - name: Generate native synthetic oracle and validate bounded C
        run: python3 web/toolchain/texture-spike/native-fixtures.py
      - name: Compare native and WASM layout, mip decoding and malformed inputs
        run: node --test web/toolchain/texture-spike/texture.test.mjs
      - name: Generate original BC3 encoding and packing oracle
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/texture-reference"
          "$RUNNER_TEMP/texture-reference/bin/pip" install 'numpy==2.0.2' 'Pillow==11.1.0'
          "$RUNNER_TEMP/texture-reference/bin/python" web/toolchain/texture-spike/native-encoder-fixtures.py
          node --test web/toolchain/texture-spike/encoder.test.mjs
      - name: Install browser test tools from official npm package
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/texture-playwright" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/texture-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise WASM in Chromium dedicated Worker
        shell: bash
        run: |
          PLAYWRIGHT_ENTRY="$RUNNER_TEMP/texture-playwright/node_modules/playwright/index.mjs" \
            node web/toolchain/texture-spike/browser-smoke.mjs
      - name: Prepare pinned self-hosted original Python codec runtime
        shell: bash
        working-directory: web/toolchain/asset-generation-spike
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:runtime
      - name: Verify original BC3 encoding, packing and cancellation in Chromium
        shell: bash
        run: |
          PLAYWRIGHT_ENTRY="$RUNNER_TEMP/texture-playwright/node_modules/playwright/index.mjs" \
            timeout --kill-after=5s 240s node web/toolchain/texture-spike/encoder-browser-smoke.mjs
      - name: Retain public WASM and required notices only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: texture-wasm-synthetic-verified
          path: web/toolchain/texture-spike/dist/
          if-no-files-found: error
          retention-days: 7
